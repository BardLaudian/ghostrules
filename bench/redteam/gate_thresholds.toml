# Thresholds and commands of the gate (bench/redteam/gate.py). Versioned: changing a line here is
# a reviewed change, never something a defender does inside its patch.

[limits]
max_src_diff_lines = 400   # added + removed lines under src/ for one round's patch

# Each command must exit 0. They run from the repository root.
[commands]
tests = ["python", "-m", "pytest", "-q"]
mypy = ["python", "-m", "mypy", "src"]
ruff_check = ["python", "-m", "ruff", "check", "."]
ruff_format = ["python", "-m", "ruff", "format", "--check", "."]
# Benign text must stay clean: the noise and held-out regression tests.
fp_suite = ["python", "-m", "pytest", "-q", "tests/test_noise_fixes.py", "tests/test_bench_heldout.py"]
perf = ["python", "bench/perf.py", "--check"]
# Compares the committed corpus results with the labels; it does not re-scan the 300 repos. The
# re-scan with the patched version is Phase 16 work and needs network, so it is not claimed here.
corpus_labels = ["python", "corpus/check.py"]
