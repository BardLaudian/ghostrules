# Attack taxonomy for the 0.6.0 detection work (docs/improvement/PLAN-0.6-deteccion.md, section 1).
# Every `technique` used by a case in bench/attacks/ appears in exactly one class below; a test
# (tests/test_redteam_taxonomy.py) fails when a case uses a technique that is not listed.
#
# `files` are the files the technique lives in; `agents` are the sections of docs/AGENT_MODELS.md
# that say the agent reads them. `direct` marks techniques whose cases in the bench are literal
# phrasings: a high recall on them says nothing about paraphrases (C5 proper).

[class.C1]
name = "Hidden text"
summary = "Invisible to a human, readable by the model"

[class.C2]
name = "Obfuscation and encoding"
summary = "The same instruction in disguise"

[class.C3]
name = "Structure and reach"
summary = "The payload arrives by a path the human does not look at, or the scan is dodged"

[class.C4]
name = "Configuration"
summary = "Risk in agent and MCP configuration, and secrets"

[class.C5]
name = "Semantics"
summary = "Intent without a fixed pattern; the bench cases are mostly direct phrasings"

[technique.unicode-tags]
class = "C1"
files = ["CLAUDE.md", "AGENTS.md", ".cursorrules", ".github/copilot-instructions.md", "GEMINI.md", "SKILL.md"]
agents = ["claude-code", "copilot-cli", "cursor", "generic", "codex", "gemini-cli"]

[technique.zero-width]
class = "C1"
files = ["CLAUDE.md", "AGENTS.md", ".cursorrules", ".github/copilot-instructions.md", "GEMINI.md", "SKILL.md"]
agents = ["claude-code", "copilot-cli", "cursor", "generic", "codex", "gemini-cli"]

[technique.bidi]
class = "C1"
files = ["CLAUDE.md", "AGENTS.md", ".cursorrules", ".github/copilot-instructions.md", "GEMINI.md"]
agents = ["claude-code", "copilot-cli", "cursor", "generic", "codex", "gemini-cli"]

[technique.variation-selectors]
class = "C1"
files = ["CLAUDE.md", "AGENTS.md", ".cursorrules", ".github/copilot-instructions.md", "GEMINI.md"]
agents = ["claude-code", "copilot-cli", "cursor", "generic", "codex", "gemini-cli"]

[technique.html-comment]
class = "C1"
