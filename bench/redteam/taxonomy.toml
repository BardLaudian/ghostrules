agents = ["claude-code", "copilot-cli", "generic", "gemini-cli"]

[technique.homoglyph]
class = "C2"
files = ["CLAUDE.md", "AGENTS.md", ".cursorrules"]
agents = ["claude-code", "cursor", "generic"]

[technique.encoded-payload]
class = "C2"
files = ["CLAUDE.md", "AGENTS.md", ".cursorrules"]
agents = ["claude-code", "cursor", "generic"]

[technique.imports]
class = "C3"
files = ["CLAUDE.md", "GEMINI.md"]
agents = ["claude-code", "gemini-cli"]

[technique.referenced-files]
class = "C3"
files = ["CLAUDE.md", "AGENTS.md"]
agents = ["claude-code", "generic"]

[technique.skill-scripts]
class = "C3"
files = ["SKILL.md", ".claude/skills/"]
agents = ["claude-code"]

[technique.hook-scripts]
class = "C3"
files = [".claude/settings.json", ".claude/hooks/"]
agents = ["claude-code"]

[technique.scanner-evasion]
class = "C3"
files = [".ghostrules.toml", "CLAUDE.md"]
agents = ["claude-code"]
note = "Dodges the scanner itself (ignore comments, exclude). Size padding (Phase 11) is C3 and is tested in tests/test_size_padding.py, not in the bench."

[technique.mcp-server-content]
class = "C3"
files = [".mcp.json"]
agents = ["claude-code"]
note = "Content a running server serves; never read by the scanner (documented limit)."

[technique.agent-settings]
