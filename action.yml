name: ghostrules scan
description: Find hidden instructions and risky settings in AGENTS.md, CLAUDE.md, .cursorrules, skills and MCP configs.
author: Pablo Seoane Temprano
branding:
  icon: eye-off
  color: purple

inputs:
  path:
    description: >-
      File or directory to scan. Leave it at the repository root: SARIF locations are relative to
      this path, so GitHub code scanning only places alerts correctly for ".".
    default: "."
  fail-on:
    description: Fail the job if a finding has at least this severity (critical, high, medium, low, info) or "none".
    default: high
  all-files:
    description: Also check every text file in the tree for hidden Unicode characters.
    default: "false"
  upload-sarif:
    description: >-
      Upload the SARIF report to GitHub code scanning (needs "security-events: write" and a
      repository where code scanning is available).
    default: "true"
  follow-imports:
    description: >-
      Also scan the files that instruction files import with @path (CLAUDE.md can pull in files no
      agent-file pattern lists). Set to "false" for the 0.1 behaviour.
    default: "true"
  lock-check:
    description: >-
      Compare what the agents read with .ghostrules.lock (create it with "ghostrules lock"). The
      differences go to the job summary under "What your agents read changed in this PR" and the
      job fails if there are any.
    default: "false"
  config:
    description: >-
      Path to a trusted ghostrules config file that replaces the repository's own .ghostrules.toml.
      It must come from somewhere a pull request cannot change (another repository's checkout, a
      file on the runner), not from the checkout under review.
    default: ""
  trust-repo-config:
    description: >-
      On pull_request events the scanner reads .ghostrules.toml from the base commit, so the pull
      request cannot exclude its own files. Set to "true" to read the pull request's own config
      (the 0.3 behaviour). Other events always use the repository's config.
    default: "false"
  inline-suppressions:
    description: >-
      Which ghostrules-ignore comments count. "base" (default): on pull_request events only those
      that already existed at the base commit, so the pull request cannot add one to hide its own
      payload (other events honour every comment). "off": none. "all": every comment (0.3).
    default: base
  approve-label:
    description: >-
      Name of a pull request label (for example agent-context-approved) that approves a change to
      what the agents read, so a lock check that finds differences passes. It approves only on the
      event that applies the label (add "labeled" to the workflow's pull_request types), so it must
      be applied again after new commits. Applying a label needs triage or write access, which a
      fork author does not have. Empty (default): nothing approves, the check fails on a change.
    default: ""

outputs:
  exit-code:
    description: "ghostrules exit code: 0 clean, 1 findings at or above fail-on, 2 error."
    value: ${{ steps.scan.outputs.exit-code }}
  sarif-file:
    description: Path of the SARIF report.
    value: ghostrules.sarif
  lock-exit-code:
    description: "Exit code of the lock check: 0 up to date, 1 changed, 2 error. Empty if lock-check is off."
    value: ${{ steps.lock.outputs.exit-code }}
  lock-approved:
    description: '"true" if the lock check found a change and the approval label passed it.'
    value: ${{ steps.lock.outputs.approved }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install ghostrules
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet "${GITHUB_ACTION_PATH}"

    - name: Resolve trusted settings
      id: trust
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_TRUST_REPO_CONFIG: ${{ inputs.trust-repo-config }}
        INPUT_INLINE_SUPPRESSIONS: ${{ inputs.inline-suppressions }}
        INPUT_LOCK_CHECK: ${{ inputs.lock-check }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        # On a pull request the configuration and the ignore comments come from the base commit,
        # never from the change under review. Any doubt stops the job: it must not scan with the
        # pull request's own settings by accident.
        args_file="${RUNNER_TEMP:-/tmp}/ghostrules-trusted.args"
        : > "$args_file"
        fail() { echo "::error title=ghostrules::$1"; exit 2; }
        case "$INPUT_INLINE_SUPPRESSIONS" in
          base | off | all) ;;
          *) fail "inline-suppressions must be base, off or all (got '$INPUT_INLINE_SUPPRESSIONS')" ;;
        esac
        is_pr=false
        case "$EVENT_NAME" in pull_request | pull_request_target) is_pr=true ;; esac
        need_base=false
        if [ -n "$INPUT_CONFIG" ]; then
          printf '%s\n' --trusted-config "$INPUT_CONFIG" >> "$args_file"
        elif [ "$is_pr" = true ] && [ "$INPUT_TRUST_REPO_CONFIG" != "true" ]; then
          need_base=true
          printf '%s\n' --config-from-ref "$BASE_SHA" >> "$args_file"
        fi
        if [ "$INPUT_INLINE_SUPPRESSIONS" = "off" ]; then
          printf '%s\n' --no-inline-suppressions >> "$args_file"
        elif [ "$INPUT_INLINE_SUPPRESSIONS" = "base" ] && [ "$is_pr" = true ]; then
          need_base=true
          printf '%s\n' --suppressions-from-ref "$BASE_SHA" >> "$args_file"
        fi
        # The lock is compared with the lock at the base as well (see "Check the lock").
        if [ "$is_pr" = true ] && [ "$INPUT_LOCK_CHECK" = "true" ] && [ "$INPUT_TRUST_REPO_CONFIG" != "true" ]; then
          need_base=true
        fi
        if [ "$need_base" = true ]; then
          [ -n "$BASE_SHA" ] || fail "no base commit in the event, so the settings of the base cannot be read"
          case "$BASE_SHA" in
            *[!0-9a-f]*) fail "the base commit in the event is not a commit id" ;;
          esac
          git -C "$INPUT_PATH" rev-parse --git-dir > /dev/null 2>&1 \
            || fail "path '$INPUT_PATH' is not inside a git repository, so the settings of the base cannot be read (set trust-repo-config and inline-suppressions to \"true\" and \"all\" to scan it with its own settings)"
          if ! git -C "$INPUT_PATH" cat-file -e "${BASE_SHA}^{commit}" 2> /dev/null; then
            # actions/checkout fetches one commit by default; the base commit is not there.
            git -C "$INPUT_PATH" fetch --no-tags --depth=1 --quiet origin "$BASE_SHA" 2> /dev/null || true
          fi
          git -C "$INPUT_PATH" cat-file -e "${BASE_SHA}^{commit}" 2> /dev/null \
            || fail "cannot read the base commit ${BASE_SHA}; check out with fetch-depth: 0 so the settings of the base can be read"
        fi

    - name: Scan
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_ALL_FILES: ${{ inputs.all-files }}
        INPUT_FOLLOW_IMPORTS: ${{ inputs.follow-imports }}
      run: |
        # The SARIF report is written whatever the result; the job is failed in the last step,
        # after the report has been uploaded and summarised.
        args=("$INPUT_PATH" --fail-on "$INPUT_FAIL_ON")
        while IFS= read -r line; do args+=("$line"); done < "${RUNNER_TEMP:-/tmp}/ghostrules-trusted.args"
        if [ "$INPUT_ALL_FILES" = "true" ]; then args+=(--all-files); fi
        if [ "$INPUT_FOLLOW_IMPORTS" = "false" ]; then args+=(--no-follow-imports); fi
        set +e
        ghostrules scan "${args[@]}" --format sarif --output ghostrules.sarif
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to code scanning
      if: ${{ inputs.upload-sarif == 'true' && !cancelled() && steps.trust.outcome == 'success' }}
      uses: github/codeql-action/upload-sarif@v3
      continue-on-error: true
      with:
        sarif_file: ghostrules.sarif
        category: ghostrules

    - name: Write job summary
      if: ${{ !cancelled() && steps.trust.outcome == 'success' }}
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_ALL_FILES: ${{ inputs.all-files }}
        INPUT_FOLLOW_IMPORTS: ${{ inputs.follow-imports }}
      run: |
        args=("$INPUT_PATH" --fail-on none)
        while IFS= read -r line; do args+=("$line"); done < "${RUNNER_TEMP:-/tmp}/ghostrules-trusted.args"
        if [ "$INPUT_ALL_FILES" = "true" ]; then args+=(--all-files); fi
        if [ "$INPUT_FOLLOW_IMPORTS" = "false" ]; then args+=(--no-follow-imports); fi
        ghostrules scan "${args[@]}" --format markdown >> "$GITHUB_STEP_SUMMARY" || true

    - name: Check the lock
      id: lock
      if: ${{ inputs.lock-check == 'true' && !cancelled() }}
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_TRUST_REPO_CONFIG: ${{ inputs.trust-repo-config }}
        INPUT_APPROVE_LABEL: ${{ inputs.approve-label }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        EVENT_LABEL: ${{ github.event.label.name }}
        EVENT_SENDER: ${{ github.event.sender.login }}
        EVENT_TIME: ${{ github.event.pull_request.updated_at }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        # Exit code 1 means "the agents' context changed since the lock"; the job is failed in the
        # last step, after the differences are in the summary. On a pull request the lock is the one
        # at the base commit: the pull request cannot re-bless its own change by regenerating it.
        report="${RUNNER_TEMP:-/tmp}/ghostrules-lock.md"
        errors="${RUNNER_TEMP:-/tmp}/ghostrules-lock.err"
        args=(lock --check --root "$INPUT_PATH" --format markdown)
        is_pr=false
        case "$EVENT_NAME" in pull_request | pull_request_target) is_pr=true ;; esac
        if [ "$is_pr" = true ] && [ "$INPUT_TRUST_REPO_CONFIG" != "true" ]; then
          args+=(--base "$BASE_SHA")
        fi
        set +e
        ghostrules "${args[@]}" > "$report" 2> "$errors"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        # A label approves only on the event that applies it, by someone who can label (triage or
        # write access), so an approval never survives new commits. Errors are never approved.
        approved=false
        if [ "$code" = "1" ] && [ "$is_pr" = true ] && [ -n "$INPUT_APPROVE_LABEL" ] \
          && [ "$EVENT_ACTION" = "labeled" ] && [ "$EVENT_LABEL" = "$INPUT_APPROVE_LABEL" ]; then
          approved=true
        fi
        echo "approved=$approved" >> "$GITHUB_OUTPUT"
        sender="$(printf '%s' "$EVENT_SENDER" | tr -cd 'A-Za-z0-9[]_.-')"
        when="$(printf '%s' "$EVENT_TIME" | tr -cd '0-9TZ:.+-')"
        label="$(printf '%s' "$INPUT_APPROVE_LABEL" | tr -cd 'A-Za-z0-9 _.:/-')"
        {
          echo "## What your agents read changed in this PR"
          echo
          if [ "$code" = "2" ]; then
            echo "The lock check could not run:"
            echo
            echo '```text'
            head -c 2000 "$errors" | tr -cd '\11\12\40-\176'
            echo '```'
          else
            if [ "$approved" = true ]; then
              echo "**Approved by @${sender:-unknown} at ${when:-an unknown time} with the label \`$label\`.**" \
                "The check passes; the differences below are what was approved."
              echo
            elif [ "$code" = "1" ] && [ -n "$INPUT_APPROVE_LABEL" ]; then
              echo "To approve this change, apply the label \`$label\` (after the last commit):" \
                "a label approves only when it is applied, so it must be applied again after new commits."
              echo
            fi
            cat "$report"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Fail if ghostrules found problems
      if: ${{ !cancelled() }}
      shell: bash
      env:
        SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
        LOCK_EXIT_CODE: ${{ steps.lock.outputs.exit-code }}
        LOCK_APPROVED: ${{ steps.lock.outputs.approved }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        final=0
        case "$SCAN_EXIT_CODE" in
          0) ;;
          1) echo "::error title=ghostrules::Findings at or above '$INPUT_FAIL_ON' severity. See the job summary and the Security tab."; final=1 ;;
          *) echo "::error title=ghostrules::The scan failed to run (exit code '$SCAN_EXIT_CODE')."; final=2 ;;
        esac
        case "$LOCK_EXIT_CODE" in
          ""|0) ;;
          1) if [ "$LOCK_APPROVED" = "true" ]; then
               echo "::notice title=ghostrules::The change to what your agents read was approved by label (approved by label; see the job summary)."
             else
               echo "::error title=ghostrules::What your agents read changed since .ghostrules.lock. Review the job summary; if the changes are intended, run 'ghostrules lock --update'."
               if [ "$final" = 0 ]; then final=1; fi
             fi ;;
          *) echo "::error title=ghostrules::The lock check failed to run (exit code '$LOCK_EXIT_CODE')."; final=2 ;;
        esac
        exit "$final"
