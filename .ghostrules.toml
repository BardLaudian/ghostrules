# ghostrules scanning its own repository: the demos and fixtures are poisoned on purpose.
exclude = [
  "examples/**",
  "tests/fixtures/**",
  "bench/redteam/rounds/*/review*.csv",  # review sheets quote the attack cases as the judge saw them
  "bench/redteam/rounds/*/verdicts.toml",  # the judge's decoded text quotes lookalike hosts on purpose
  "dist/**",
  "build/**",
  ".mypy_cache/**",
  ".ruff_cache/**",
  ".pytest_cache/**",
  "corpus/.cache/**",  # API responses and clones are other people's text
  "corpus/results/**",
]
