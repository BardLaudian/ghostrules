# ghostrules scanning its own repository: the demos and fixtures are poisoned on purpose.
exclude = [
  "examples/**",
  "tests/fixtures/**",
  "dist/**",
  "build/**",
  ".mypy_cache/**",
  ".ruff_cache/**",
  ".pytest_cache/**",
  "corpus/.cache/**",  # API responses and clones are other people's text
  "corpus/results/**",
]
