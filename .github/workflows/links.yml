name: Links

# Dead links in the documentation. Not part of the required checks (`ci-ok`): a third-party site
# being down must not block a merge. It runs on pull requests that touch Markdown, weekly, and by hand.
on:
  pull_request:
    paths: ["**/*.md", "lychee.toml", ".github/workflows/links.yml"]
  schedule:
    - cron: "41 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress "**/*.md"
          fail: true
