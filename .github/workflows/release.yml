name: Release

# Push a tag like v0.1.0 to publish. PyPI uses Trusted Publishing (OIDC): there is no API token
# in this repository. One-time setup on PyPI: add a "pending publisher" for this repository,
# workflow "release.yml" and environment "pypi".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: The tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          version = re.search(r'__version__ = "([^"]+)"', open("src/ghostrules/__init__.py").read()).group(1)
          tag = os.environ["TAG"].removeprefix("v")
          assert version == tag, f"tag {tag} does not match __version__ {version}"
          PY

      - name: The changelog must have release notes for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/changelog_section.py "$TAG" > release-notes.md

      - name: Build
        run: |
          python -m pip install --disable-pip-version-check --quiet build
          python -m build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            dist/
            release-notes.md

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --notes-file release-notes.md

  move-major-tag:
    # Users pin BardLaudian/ghostrules@v0 (or an exact tag). Only a stable x.y.z release moves it.
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Move the v0 tag to this release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is not a stable v0.x.y release: the v0 tag stays where it is"
            exit 0
          fi
          git tag -f v0 "$TAG"
          git push --force origin v0

