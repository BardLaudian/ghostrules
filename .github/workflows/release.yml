name: Release

# Push a tag like v0.1.0 to publish. PyPI uses Trusted Publishing (OIDC): there is no API token
# in this repository. One-time setup on PyPI: add a "pending publisher" for this repository,
# workflow "release.yml" and environment "pypi".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: The tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          version = re.search(r'__version__ = "([^"]+)"', open("src/ghostrules/__init__.py").read()).group(1)
          tag = os.environ["TAG"].removeprefix("v")
          assert version == tag, f"tag {tag} does not match __version__ {version}"
          PY

      - name: The changelog must have release notes for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/changelog_section.py "$TAG" > release-notes.md

      - name: Build
        run: |
          python -m pip install --disable-pip-version-check --quiet build
          python -m build

      - name: SBOM (CycloneDX)
        run: |
          # a clean environment, so the SBOM lists ghostrules and its runtime dependencies only
          python -m venv sbom-env
          sbom-env/bin/python -m pip install --disable-pip-version-check --quiet .
          python -m pip install --disable-pip-version-check --quiet cyclonedx-bom
          mkdir sbom
          cyclonedx-py environment --of JSON -o sbom/ghostrules-sbom.cdx.json sbom-env

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/
            release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing and PyPI attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true # PEP 740 attestations, signed with this workflow's OIDC identity

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom
      - name: Attest the build provenance of the distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the GitHub release (distributions and SBOM)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" dist/* sbom/ghostrules-sbom.cdx.json --repo "$REPO" --title "$TAG" --notes-file release-notes.md

  move-major-tag:
    # Users pin BardLaudian/ghostrules@v0 (or an exact tag). Only a stable x.y.z release moves it.
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Move the v0 tag to this release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is not a stable v0.x.y release: the v0 tag stays where it is"
            exit 0
          fi
          git tag -f v0 "$TAG"
          git push --force origin v0

