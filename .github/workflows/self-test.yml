name: Self-test

# Runs the action from this very checkout against the demo repositories.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Poisoned demo with fail-on none (must pass, must report findings)
        id: poisoned
        uses: ./
        with:
          path: examples/poisoned-repo
          fail-on: none
          upload-sarif: "false"

      - name: SARIF must contain results, led by the hidden instruction
        run: |
          python - <<'PY'
          import json
          run = json.load(open("ghostrules.sarif"))["runs"][0]
          results = run["results"]
          assert len(results) > 10, f"expected many results, got {len(results)}"
          ids = {r["ruleId"] for r in results}
          assert {"GR001", "GR012", "GR101"} <= ids, ids
          assert results[0]["ruleId"] == "GR001", results[0]["ruleId"]
          assert run["tool"]["driver"]["rules"], "rules missing"
          print(f"ok: {len(results)} results")
          PY

      - name: The exit-code output is 0
        env:
          EXIT_CODE: ${{ steps.poisoned.outputs.exit-code }}
        run: test "$EXIT_CODE" = "0"

      - name: Poisoned demo with the default fail-on (must fail the step)
        id: gate
        uses: ./
        continue-on-error: true
        with:
          path: examples/poisoned-repo
          upload-sarif: "false"

      - name: The gate must have failed
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          EXIT_CODE: ${{ steps.gate.outputs.exit-code }}
        run: |
          test "$OUTCOME" = "failure"
          test "$EXIT_CODE" = "1"

      - name: Clean demo (must pass with no results)
        uses: ./
        with:
          path: examples/clean-repo
          upload-sarif: "false"

      - name: SARIF must be empty
        run: |
          python - <<'PY'
          import json
          results = json.load(open("ghostrules.sarif"))["runs"][0]["results"]
          assert results == [], results
          PY

  import-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import-chain demo, following imports (default)
        uses: ./
        with:
          path: examples/import-chain-repo
          fail-on: none
          upload-sarif: "false"

      - name: SARIF must carry the hidden payload with the import chain that reaches it
        run: |
          python - <<'PY'
          import json
          results = json.load(open("ghostrules.sarif"))["runs"][0]["results"]
          ids = {r["ruleId"] for r in results}
          assert {"GR001", "GR020", "GR021"} <= ids, ids
          hidden = next(r for r in results if r["ruleId"] == "GR001")
          chain = [l["physicalLocation"]["artifactLocation"]["uri"] for l in hidden["relatedLocations"]]
          assert chain == ["CLAUDE.md", "docs/style.md"], chain
          assert hidden["locations"][0]["physicalLocation"]["artifactLocation"]["uri"] == "shared/team-rules.md"
          assert "reached-via-import" in hidden["properties"]["tags"]
          print(f"ok: {len(results)} results")
          PY

      - name: Import-chain demo with follow-imports off (a 0.1-style scan finds nothing)
        uses: ./
        with:
          path: examples/import-chain-repo
          follow-imports: "false"
          upload-sarif: "false"

      - name: SARIF must be empty
        run: |
          python - <<'PY'
          import json
          results = json.load(open("ghostrules.sarif"))["runs"][0]["results"]
          assert results == [], results
          PY

      - name: Lock a copy of the demo, then make a pull-request-like change to another copy
        run: |
          python scripts/make_demo.py --lock-scenario "$RUNNER_TEMP/acme"
          ghostrules lock --root "$RUNNER_TEMP/acme/base"
          cp "$RUNNER_TEMP/acme/base/.ghostrules.lock" "$RUNNER_TEMP/acme/pr/"

      - name: Lock check on the unchanged repository (must pass)
        id: unchanged
        uses: ./
        with:
          path: ${{ runner.temp }}/acme/base
          # not a git repository: scanned with its own settings
          trust-repo-config: "true"
          inline-suppressions: all
          fail-on: none
          lock-check: "true"
          upload-sarif: "false"

      - name: The unchanged lock exit code is 0
        env:
          LOCK_EXIT_CODE: ${{ steps.unchanged.outputs.lock-exit-code }}
        run: test "$LOCK_EXIT_CODE" = "0"

      - name: Lock check after the pull request (must fail the step)
        id: changed
        uses: ./
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/acme/pr
          # not a git repository: scanned with its own settings
          trust-repo-config: "true"
          inline-suppressions: all
          fail-on: none
          lock-check: "true"
          upload-sarif: "false"

      - name: The changed lock must have failed with exit code 1
        env:
          OUTCOME: ${{ steps.changed.outcome }}
          LOCK_EXIT_CODE: ${{ steps.changed.outputs.lock-exit-code }}
        run: |
          test "$OUTCOME" = "failure"
          test "$LOCK_EXIT_CODE" = "1"
