name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest -q
      - name: Smoke test the demos
        shell: bash
        run: |
          ghostrules scan examples/clean-repo
          code=0
          ghostrules scan examples/poisoned-repo --no-color > /dev/null || code=$?
          test "$code" = "1"
      - name: ghostrules scans its own repository
        shell: bash
        run: |
          ghostrules scan . --no-color
          ghostrules scan . --all-files --no-color
          ghostrules lock --check --no-color
