name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest -q
      - name: Smoke test the demos
        shell: bash
        run: |
          ghostrules scan examples/clean-repo
          code=0
          ghostrules scan examples/poisoned-repo --no-color > /dev/null || code=$?
          test "$code" = "1"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: mypy (strict)
        run: mypy src

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the package and pip-audit
        run: pip install . pip-audit==2.10.1
      - name: Audit the runtime dependencies and the pinned action requirements
        run: |
          pip-audit --skip-editable
          pip-audit --require-hashes -r action-requirements.txt

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: ghostrules scans its own repository
        run: |
          ghostrules scan . --no-color
          ghostrules scan . --all-files --no-color
          ghostrules lock --check --no-color

  # Speed budget (docs/PERFORMANCE.md): loose on purpose, it catches a rule that turned quadratic.
  # One stable name for the branch ruleset: "test" is a matrix, so its checks are named per
  # combination and no check is called plain "test". This job fails unless every job succeeded.
  ci-ok:
    if: always()
    needs: [test, typecheck, audit, self-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "a required job did not succeed: $r"; exit 1; }
          done
