name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest -q
      - name: Smoke test the demos
        shell: bash
        run: |
          ghostrules scan examples/clean-repo
          code=0
          ghostrules scan examples/poisoned-repo --no-color > /dev/null || code=$?
          test "$code" = "1"
      - name: ghostrules scans its own repository
        shell: bash
        run: |
          ghostrules scan . --no-color
          ghostrules scan . --all-files --no-color
          ghostrules lock --check --no-color
