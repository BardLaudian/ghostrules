name: Corpus

# Runs ghostrules against the public repositories listed in corpus/repos.toml (the only networked
# part of the project). Never on pull requests.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus
  cancel-in-progress: false

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install ghostrules from this checkout
        run: pip install -e ".[dev]"
      - name: Scan the regression tier
        run: python corpus/run.py --tier regression
      - name: Gate against labels.toml
        run: python corpus/check.py
      - name: Aggregate files (badge and summary, counts only)
        if: always() && hashFiles('corpus/results/latest-summary.json') != ''
        run: python corpus/badge.py --out corpus-public
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corpus-results
          path: |
            corpus/results
            corpus-public
          retention-days: 30
          if-no-files-found: ignore

  publish:
    # Only the default branch publishes; the badge reads corpus/badge.json from the orphan
    # branch "badges" (gh-pages is not served: Pages is deployed from Actions by pages.yml).
    needs: corpus
    if: always() && needs.corpus.result != 'skipped' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: corpus-results
          path: artifact
      - name: Publish to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f artifact/corpus-public/badge.json
          git clone --quiet --depth 1 --branch badges \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" site \
            || { mkdir site && git -C site init --quiet -b badges \
              && git -C site remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"; }
          mkdir -p site/corpus
          cp artifact/corpus-public/badge.json artifact/corpus-public/summary.json site/corpus/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus
          git diff --cached --quiet || git commit --quiet -m "corpus: weekly summary"
          git push origin badges
