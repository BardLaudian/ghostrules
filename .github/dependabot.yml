# Keeps the commit-pinned actions (.github/workflows, action.yml) and the Python dependencies
# (pyproject.toml, action-requirements.in/.txt) up to date, one grouped weekly pull request each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
