# Link check for the Markdown files (see .github/workflows/links.yml).
max_retries = 3
# 503 from github.com is throttling: fewer parallel requests, and wait before a retry
max_concurrency = 8
retry_wait_time = 5
timeout = 20
# 429: rate limited, not dead. 403: some sites refuse automated clients.
accept = ["200..=299", "403", "429"]
exclude_path = [
  ".venv", "node_modules", "_site", "study/data", "corpus/results",
  "tests/fixtures", "examples", "bench/attacks", "bench/.cache",
]
exclude = [
  # a path that is written in the docs as an example, and addresses that must not resolve
  '\.example',
  '^https://github\.com/BardLaudian/ghostrules/(compare|releases/tag)/',
  '^https://api\.securityscorecards\.dev/',
  '^https://img\.shields\.io/',
  '^https://raw\.githubusercontent\.com/BardLaudian/ghostrules/badges/',
]
