# Evasion and attack corpus: every case is labelled; run `python scripts/corpus_metrics.py`.
# ASCII only: invisible and look-alike characters are written as \u escapes.
# label = attack: `rule` must be reported. label = benign: nothing may be reported.
# status = "open": a known miss (attack) or known false positive (benign); the gate expects it to
# fail, and fails when it starts passing so the marker gets removed.

