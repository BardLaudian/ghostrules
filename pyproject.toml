[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghostrules"
dynamic = ["version"]
description = "Find the instructions your AI agent sees but you don't."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Pablo Seoane Temprano" }]
keywords = ["security", "ai-agents", "prompt-injection", "mcp", "unicode", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "jsonschema>=4",
    "pyyaml>=6",
    "hatchling",
]
web-test = ["playwright>=1.45"]
study = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/BardLaudian/ghostrules"
Documentation = "https://github.com/BardLaudian/ghostrules#readme"
Issues = "https://github.com/BardLaudian/ghostrules/issues"
Changelog = "https://github.com/BardLaudian/ghostrules/blob/main/CHANGELOG.md"

[project.scripts]
ghostrules = "ghostrules.cli:app"

[tool.hatch.version]
path = "src/ghostrules/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/corpus", "corpus/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/ghostrules"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"study/report.py" = ["E501"]  # the report template is prose
"bench/run.py" = ["E501"]  # markdown table rows

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
