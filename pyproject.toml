[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghostrules"
dynamic = ["version"]
description = "Find the instructions your AI agent sees but you don't."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Pablo Seoane Temprano" }]
keywords = ["security", "ai-agents", "prompt-injection", "mcp", "unicode", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.5",
    "ruff==0.17.3",
    "mypy==2.4.0",
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
    "hatchling==1.33.0",
]

[project.urls]
Homepage = "https://github.com/BardLaudian/ghostrules"
Documentation = "https://github.com/BardLaudian/ghostrules#readme"
Issues = "https://github.com/BardLaudian/ghostrules/issues"
Changelog = "https://github.com/BardLaudian/ghostrules/blob/main/CHANGELOG.md"

[project.scripts]
ghostrules = "ghostrules.cli:main"

[tool.hatch.version]
path = "src/ghostrules/__init__.py"


[tool.hatch.build.targets.wheel]
packages = ["src/ghostrules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: hostile-input time budget; run with pytest -m slow"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 60

[tool.ruff.lint.per-file-ignores]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
strict = true
